name: Update Inspiration

# 灵感库自动更新：北京时间每天 20:00（UTC 12:00，Actions 实际触发有 5~30 分钟延迟）
# 手动触发：本页右上角 "Run workflow" 按钮

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-inspiration
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch & analyse inspiration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node tools/fetch_inspiration.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet data/inspiration.js && git diff --quiet inbox 2>/dev/null; then
            echo "没有新内容，跳过提交"
          else
            git config user.name "inspiration-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "灵感库自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
