name: Update Inspiration

# 灵感库更新：仅手动触发（已取消每日定时）
# 触发方式：灵感库页「更新」按钮（页内直接触发），或本仓库 Actions 页 Run workflow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-inspiration
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch & analyse inspiration
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node tools/fetch_inspiration.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet data/inspiration.js && git diff --quiet inbox 2>/dev/null; then
            echo "没有新内容，跳过提交"
          else
            git config user.name "inspiration-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "灵感库自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
