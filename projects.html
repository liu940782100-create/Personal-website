<body data-page="projects">
  <div id="nav"></div>

  <main class="container">
    <section class="page-head">
      <h1 data-i18n="proj.head">项目库</h1>
      <p data-i18n="proj.sub">四个阶段推进项目，门径与产出物随项目状态同步调整</p>
    </section>

    <div class="toolbar">
      <select id="filterStage"></select>
      <select id="filterType"></select>
      <select id="filterLevel"></select>
      <input type="text" id="searchKw" class="grow" placeholder="搜索：项目名 / 目标…" data-i18n-ph="proj.search.ph">
      <span class="count" id="countInfo"></span>
      <button type="button" class="btn" id="selectModeBtn"></button>
      <button type="button" class="btn" id="exportLocalBtn"></button>
      <button type="button" class="btn" id="importLocalBtn"></button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
      <button type="button" class="btn btn-primary" id="newProjectBtn"></button>
    </div>

    <div class="batch-bar" id="batchBar" hidden>
      <span class="sel-count" id="selCount"></span>
      <button type="button" class="btn btn-mini" id="selAllBtn"></button>
      <button type="button" class="btn btn-mini btn-danger-ghost" id="selDeleteBtn"></button>
      <button type="button" class="btn btn-mini" id="selExportBtn"></button>
      <button type="button" class="btn btn-mini" id="selImportBtn"></button>
    </div>

    <section class="kanban" id="kanban"></section>

    <!-- 归档区（可折叠） -->
    <section class="ref-panel" id="archivePanel" hidden>
      <button type="button" class="ref-toggle" id="archiveToggle">
        <span class="ref-toggle-mark">◇</span>
        <span id="archiveToggleLabel"></span>
        <span class="ref-hint" id="archiveCount"></span>
      </button>
      <div class="ref-body" id="archiveBody" hidden>
        <div id="archivedList"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

    /* =========================================================
     * 本地存储（本地项目 / 资料 / 分析记录）
     * ========================================================= */
    var LS_PROJ = 'rl_projects_local_v1';
    var LS_FILES = 'rl_proj_files_v1';
    var LS_AI = 'rl_proj_analysis_v1';

    function lsGet(key, fb) {
      try { return JSON.parse(localStorage.getItem(key)) || fb; } catch (e) { return fb; }
    }
    function lsSet(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {
        alert(getLang() === 'en' ? 'localStorage quota exceeded' : '浏览器存储已满，请删除部分资料后重试');
      }
    }
    function loadLocal() { return lsGet(LS_PROJ, []); }
    function saveLocal(a) { lsSet(LS_PROJ, a); }
    function allProjects() { return getData('projects').concat(loadLocal()); }
    function isLocal(p) { return /^local-/.test(p.id); }
    function filesOf(id) { return lsGet(LS_FILES, {})[id] || []; }
    function analysisOf(id) { return lsGet(LS_AI, {})[id] || []; }

    function fileHref(path) {
      var s = String(path).replace(/\\/g, '/');
      return /^https?:\/\//i.test(s) ? s : encodeURI('file:///' + s);
    }

    function toast(msg) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(function () { t.classList.remove('show'); }, 2600);
    }

    function today() { return new Date().toISOString().slice(0, 10); }
    function nowStr() {
      var d = new Date();
      return today() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    /* =========================================================
     * 流程模板生成（裁剪规则的核心落地）
     * ========================================================= */
    function generateProcess(type, level, scale) {
      var steps = (STEP_TPL[type] || []).map(function (s) {
        return { step: s[0], agent: s[1], output: s[2], status: '待开始' };
      });
      var gates = (GATE_TPL[type] || []).map(function (g) {
        return { name: g[0], status: '未到', note: g[1] };
      });
      var notes = [];

      /* 类型 × 规模特例：硬件微型合并仿真与设计 */
      if (type === 'hw' && scale === 'micro') {
        steps = [
          { step: '概念与需求', agent: 'AI 市场调研', output: '市场需求文档', status: '待开始' },
          { step: '架构与详细设计（合并）', agent: 'AI 仿真对标 + DFM 审查', output: '架构与工程验证报告', status: '待开始' },
          { step: '样机试制与测试', agent: 'AI 测试用例', output: '样机实测数据', status: '待开始' },
          { step: '小批量试产', agent: 'AI 供应链扫描', output: '试产良率报告', status: '待开始' },
          { step: '市场发布', agent: 'AI 发布物料', output: '发布物料包', status: '待开始' }
        ];
        gates = [
          { name: '设计冻结门（开模前）', status: '未到', note: '开模不可逆，放行检查不可裁' },
          { name: '量产放行门', status: '未到', note: '试产良率 + 二供预案' }
        ];
        notes.push(MATRIX.hw.micro);
      }

      /* 等级裁剪门径 */
      if (level === 'S' && gates.length > 1 && type !== 'hw') {
        gates = [gates[gates.length - 1]];
        gates[0].note += ' ｜ ' + L(STR.wzSelfCheck);
      } else if (level === 'S' && type === 'hw' && gates.length > 2) {
        /* 硬件 S 级保留不可逆门径，去掉中间评审 */
        gates = [gates[0], gates[gates.length - 1]];
      }
      if ((level === 'L' || (level === 'M' && (scale === 'mid' || scale === 'big' || scale === 'xorg'))) && type !== 'rd') {
        gates.push({ name: L(STR.wzMidCheck), status: '未到', note: getLang() === 'en' ? 'Progress deviation > 20% triggers adjustment' : '进度偏差超 20% 即触发调整' });
      }

      /* 规模决定门径形式 */
      if (scale === 'micro') notes.push(STR.wzStandup);
      if (scale === 'big' || scale === 'xorg') {
        notes.push(STR.wzIndep);
        if (level === 'L') notes.push(STR.wzBaseline);
      }
      if (type && MATRIX[type] && scale) {
        notes.push(MATRIX[type][scale === 'xorg' ? 'big' : scale]);
      }
      if (level === 'L' && type === 'hw') notes.push({ zh: '六阶段六门径全保留，认证并行推进', en: 'All 6 stages / 6 gates; certification runs in parallel' });

      return { steps: steps, gates: gates, notes: notes.map(function (n) { return L(n); }) };
    }

    /* =========================================================
     * 筛选器与工具栏
     * ========================================================= */
    function buildFilters() {
      var keep = ['filterStage', 'filterType', 'filterLevel'].map(function (id) {
        return document.getElementById(id).value;
      });
      document.getElementById('filterStage').innerHTML =
        '<option value="">' + esc(L(STR.allStage)) + '</option>' +
        STAGES.map(function (s) { return '<option value="' + s + '">' + esc(stageLabel(s)) + '</option>'; }).join('');
      document.getElementById('filterType').innerHTML =
        '<option value="">' + esc(L(STR.allType)) + '</option>' +
        Object.keys(TYPES).map(function (k) { return '<option value="' + k + '">' + esc(L(TYPES[k].name)) + '</option>'; }).join('');
      document.getElementById('filterLevel').innerHTML =
        '<option value="">' + esc(L(STR.allLevel)) + '</option>' +
        ['S', 'M', 'L'].map(function (k) { return '<option value="' + k + '">' + esc(L(LEVELS[k].name)) + '</option>'; }).join('');
      document.getElementById('exportLocalBtn').textContent = L(STR.expLocal);
      document.getElementById('importLocalBtn').textContent = L(STR.impLocal);
      document.getElementById('newProjectBtn').textContent = L(STR.newProject);
      document.getElementById('selectModeBtn').textContent = L(selectMode ? STR.selOff : STR.selOn);
      document.getElementById('selAllBtn').textContent = L(STR.selAll);
      document.getElementById('selDeleteBtn').textContent = L(STR.selDelete);
      document.getElementById('selExportBtn').textContent = L(STR.selExport);
      document.getElementById('selImportBtn').textContent = L(STR.projImport);
      ['filterStage', 'filterType', 'filterLevel'].forEach(function (id, i) {
        document.getElementById(id).value = keep[i];
      });
    }

    function stageLabel(s) {
      var m = { '构想': t('proj.stage.idea'), '设计': t('proj.stage.design'),
                '执行': t('proj.stage.execute'), '复盘': t('proj.stage.review') };
      return m[s] || s || '-';
    }
    function statusLabel(s) {
      var m = { '完成': t('proj.status.done'), '进行中': t('proj.status.doing'),
                '待开始': t('proj.status.todo') };
      return m[s] || s || t('proj.status.todo');
    }
    function gatesPassed(p) { return (p.gates || []).filter(function (g) { return g.status === '通过'; }).length; }
    function gatesTotal(p) { return (p.gates || []).length; }
    function stepsDone(p) { return (p.workflow || []).filter(function (s) { return s.status === '完成'; }).length; }
    function stepsTotal(p) { return (p.workflow || []).length; }

    /* =========================================================
     * 看板 + 归档区
     * ========================================================= */
    function renderPCard(p, archived) {
      var total = stepsTotal(p), done = stepsDone(p);
      var gTotal = gatesTotal(p), gDone = gatesPassed(p);
      var pendingGates = (p.gates || []).filter(function (g) { return g.status === '待审'; }).length;
      var pct = total ? Math.round(done / total * 100) : 0;
      var local = isLocal(p) && !archived;
      var editable = isLocal(p);
      var isSel = !!selected[p.id];
      return '<div class="p-card' + (archived ? ' p-archived' : '') + (pendingGates ? ' p-gate-alert' : '') +
        (isSel ? ' p-selected' : '') + (selectMode && !editable ? ' p-noselect' : '') + '"' +
        ' role="button" tabindex="0"' +
        (pendingGates ? ' title="' + esc(pendingGates + L(STR.gateAlert)) + '"' : '') +
        ' onclick="pCardClick(event,\'' + esc(p.id) + '\')" onkeydown="pCardKey(event,\'' + esc(p.id) + '\')">' +
        (selectMode
          ? '<label class="p-check" onclick="event.stopPropagation()">' +
              '<input type="checkbox"' + (isSel ? ' checked' : '') + (editable ? '' : ' disabled') +
              ' onchange="toggleSelect(\'' + esc(p.id) + '\')" aria-label="' + esc(L(STR.selOn)) + '">' +
            '</label>'
          : '') +
        '<h4>' + esc(p.name) +
          (p.inspSource ? '<span class="insp-badge">♡ ' + esc(L({ zh: '灵感备档', en: 'From Inspiration' })) + '</span>' : '') +
          (archived ? '<span class="arch-badge">' + esc(L(STR.archivedBadge)) + '</span>' : '') +
        '</h4>' +
        '<div class="p-tags">' +
          '<span class="level-badge lvl-' + esc(p.level || 'M') + '">' + esc(L((LEVELS[p.level] || LEVELS.M).name)) + '</span>' +
          (p.type && TYPES[p.type] ? '<span class="type-badge">' + esc(L(TYPES[p.type].name)) + '</span>' : '') +
          (p.scale && SCALES[p.scale] ? '<span class="scale-badge">' + esc(L(SCALES[p.scale])) + '</span>' : '') +
        '</div>' +
        '<div class="p-goal">' + esc(p.goal || L(STR.noGoal)) + '</div>' +
        (p.link
          ? '<div class="p-link-row"><a href="' + esc(fileHref(p.link)) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">▤ ' + esc(L(STR.linkOpen)) + '</a></div>'
          : '') +
        (local
          ? '<div class="p-stage-pick" onclick="event.stopPropagation()">' +
            STAGES.map(function (s) {
              return '<button type="button" class="st-chip' + (p.stage === s ? ' on' : '') + '" onclick="setProjectStage(\'' + esc(p.id) + '\',\'' + s + '\')">' + esc(stageLabel(s)) + '</button>';
            }).join('') + '</div>'
          : '') +
        (total
          ? '<div class="p-progress"><i style="width:' + pct + '%"></i></div>' +
            '<div class="p-progress-text">' + esc(L(STR.wfPrefix)) + done + '/' + total +
              (gTotal ? esc(L(STR.gatesPassed)) + gDone + '/' + gTotal : '') +
              ' · ' + esc(L(STR.updated)) + esc(p.updatedAt || '-') + '</div>'
          : '<div class="p-progress-text">' + esc(L(STR.updated)) + esc(p.updatedAt || '-') + '</div>') +
      '</div>';
    }

    function renderBoard() {
      var fs = document.getElementById('filterStage').value;
      var ft = document.getElementById('filterType').value;
      var fl = document.getElementById('filterLevel').value;
      var kw = document.getElementById('searchKw').value.trim().toLowerCase();

      var all = allProjects();
      var list = all.filter(function (p) {
        if (p.archived) return false;
        if (fs && p.stage !== fs) return false;
        if (ft && p.type !== ft) return false;
        if (fl && p.level !== fl) return false;
        if (kw) {
          var text = ((p.name || '') + ' ' + (p.goal || '')).toLowerCase();
          if (text.indexOf(kw) < 0) return false;
        }
        return true;
      });

      document.getElementById('countInfo').textContent =
        list.length + ' / ' + all.length + L(STR.countUnit);

      var showStages = fs ? [fs] : STAGES;
      document.getElementById('kanban').innerHTML = showStages.map(function (stage) {
        var col = list.filter(function (p) { return p.stage === stage; });
        return '<div class="kanban-col">' +
          '<h3>' + ((STAGE_ICONS[stage] || '') ? '<span class="stage-mark">' + STAGE_ICONS[stage] + '</span>' : '') + stageLabel(stage) +
            '<span class="col-count">' + col.length + '</span></h3>' +
          (col.length
            ? col.map(function (p) { return renderPCard(p, false); }).join('')
            : '<div class="empty" style="padding:24px 0;font-size:12.5px">' + esc(L(STR.emptyCol)) + '</div>') +
        '</div>';
      }).join('');

      renderArchived(list, all);
      updateBatchBar();
    }

    /* =========================================================
     * 点选模式：勾选 → 删除 / 导出
     * ========================================================= */
    var selectMode = false;
    var selected = {};

    function selectedIds() { return Object.keys(selected).filter(function (id) { return selected[id]; }); }

    function updateBatchBar() {
      var bar = document.getElementById('batchBar');
      if (!selectMode) { bar.hidden = true; return; }
      var locals = loadLocal().map(function (p) { return p.id; });
      Object.keys(selected).forEach(function (id) { /* 项目已不存在则移除勾选 */
        if (locals.indexOf(id) < 0) delete selected[id];
      });
      bar.hidden = false;
      document.getElementById('selCount').textContent = L(STR.selCount).replace('{n}', selectedIds().length);
    }

    function toggleSelectMode() {
      selectMode = !selectMode;
      if (!selectMode) selected = {};
      document.getElementById('selectModeBtn').textContent = L(selectMode ? STR.selOff : STR.selOn);
      renderBoard();
    }

    function toggleSelect(id) {
      if (!isLocal(findProject(id) || {})) { toast(L(STR.selReadonly)); return; }
      if (selected[id]) delete selected[id]; else selected[id] = true;
      renderBoard();
    }

    function selectAllVisible() {
      var kw = document.getElementById('searchKw').value.trim().toLowerCase();
      var fs = document.getElementById('filterStage').value;
      var ft = document.getElementById('filterType').value;
      var fl = document.getElementById('filterLevel').value;
      var ids = loadLocal().filter(function (p) {
        if (fs && p.stage !== fs) return false;
        if (ft && p.type !== ft) return false;
        if (fl && p.level !== fl) return false;
        if (kw) {
          var text = ((p.name || '') + ' ' + (p.goal || '')).toLowerCase();
          if (text.indexOf(kw) < 0) return false;
        }
        return true;
      }).map(function (p) { return p.id; });
      if (ids.every(function (id) { return selected[id]; })) {
        ids.forEach(function (id) { delete selected[id]; });
      } else {
        ids.forEach(function (id) { selected[id] = true; });
      }
      renderBoard();
    }

    function deleteProjects(ids) {
      var locals = loadLocal();
      var files = lsGet(LS_FILES, {});
      var ai = lsGet(LS_AI, {});
      ids.forEach(function (id) { delete files[id]; delete ai[id]; });
      saveLocal(locals.filter(function (p) { return ids.indexOf(p.id) < 0; }));

    var TEXT_EXT = ['txt', 'md', 'json', 'csv', 'js', 'html', 'css', 'xml', 'log', 'markdown'];
    var MAX_TEXT = 512 * 1024;

    function registerFiles(pid, fileList) {
      var store = lsGet(LS_FILES, {});
      if (!store[pid]) store[pid] = [];
      var pending = Array.prototype.slice.call(fileList);
      (function next() {
        if (!pending.length) {
          lsSet(LS_FILES, store);
          toast(L(STR.fileSaved));
          refreshDetail(pid);
          return;
        }
        var f = pending.shift();
        var ext = (f.name.split('.').pop() || '').toLowerCase();
        var rec = { name: f.name, size: f.size, addedAt: today(), text: '', metaOnly: false };
        if (TEXT_EXT.indexOf(ext) >= 0 && f.size <= MAX_TEXT) {
          var reader = new FileReader();
          reader.onload = function () { rec.text = String(reader.result || '').slice(0, 120000); store[pid].push(rec); next(); };
          reader.onerror = function () { rec.metaOnly = true; store[pid].push(rec); next(); };
          reader.readAsText(f);
        } else {
          rec.metaOnly = true;
          store[pid].push(rec);
          next();
        }
      })();
    }

    function deleteFile(pid, idx) {
      var store = lsGet(LS_FILES, {});
      if (store[pid]) store[pid].splice(idx, 1);
      lsSet(LS_FILES, store);

    /* =========================================================
     * AI 分析（规则引擎：对照门径 / 底线两问 / 资料 / 三资产）
     * ========================================================= */
    function keywordsOf(s) {
      return String(s || '').split(/[\s\/、,，;；()（）]+/).filter(function (w) { return w.length >= 2; });
    }

    function runAnalysis(pid) {
      var p = findProject(pid);
      if (!p) return;
      var files = filesOf(pid);
      var zh = getLang() !== 'en';
      var lines = [];

      /* 1. 底线两问 */
      var critBlock = [L(STR.aiT1)];
      var critMissing = [];
      if (!p.accept) critMissing.push(zh ? '验收标准' : 'acceptance');
      if (!p.kill) critMissing.push(zh ? '放弃条件' : 'kill criteria');
      critBlock.push(critMissing.length
        ? L(STR.aiCritNo) + critMissing.join('、') + '。' + L(STR.aiFixCrit)
        : L(STR.aiCritOk));

      /* 2. 门径状态 */
      var gateBlock = [L(STR.aiT2)];
      var gates = p.gates || [];
      if (!gates.length) {
        gateBlock.push(L(STR.aiGateNone));
      } else {
        var pending = gates.filter(function (g) { return g.status === '待审'; });
        if (pending.length) {
          gateBlock.push(L(STR.aiGatePending)
            .replace('{n}', pending.length)
            .replace('{g}', pending.map(function (g) { return g.name; }).join('、')));
        } else {
          gateBlock.push(L(STR.aiGateClean));
        }
      }

      /* 3. 资料完备度：当前阶段应产出 vs 已上传资料 */
      var fileBlock = [L(STR.aiT3)];
      var wf = p.workflow || [];
      var stageIdx = STAGES.indexOf(p.stage);
      var span = { 0: [0, 2], 1: [1, 4], 2: [2, Math.max(2, wf.length - 1)], 3: [Math.max(0, wf.length - 1), wf.length] }[stageIdx] || [0, wf.length];
      var expected = wf.slice(span[0], span[1]).filter(function (s) { return s.status !== '完成'; });
      if (!expected.length) expected = wf.slice(span[0], span[1]);
      var allText = files.map(function (f) { return (f.name + ' ' + (f.text || '')).toLowerCase(); }).join('\n');
      if (!files.length) {
        fileBlock.push(L(STR.aiFileNone));
      } else if (expected.length) {
        var hit = null, miss = null;
        for (var i = 0; i < expected.length; i++) {
          var kws = keywordsOf(expected[i].output);
          var ok = kws.some(function (k) { return allText.indexOf(k.toLowerCase()) >= 0; });
          if (ok && !hit) hit = expected[i];
          if (!ok && !miss) miss = expected[i];
        }
        if (hit) {
          var hitFile = files.filter(function (f) {
            return keywordsOf(hit.output).some(function (k) { return (f.name + ' ' + (f.text || '')).toLowerCase().indexOf(k.toLowerCase()) >= 0; });
          })[0];
          fileBlock.push(L(STR.aiFileOk)
            .replace('{s}', stageLabel(p.stage))
            .replace('{o}', hit.output)
            .replace('{f}', hitFile ? hitFile.name : '-'));
        }
        if (!hit && miss) {
          fileBlock.push(L(STR.aiFileMiss).replace('{s}', stageLabel(p.stage)).replace('{o}', miss.output));
        }
        if (!hit && !miss) {
          fileBlock.push(L(STR.aiFileOk).replace('{s}', stageLabel(p.stage)).replace('{o}', expected[0].output).replace('{f}', files[0].name));
        }
      } else {
        fileBlock.push(files.length + ' 份资料在案。');
      }

      /* 4. 复盘三资产 */
      var revBlock = [L(STR.aiT4)];
      if (p.stage !== '复盘') {
        revBlock.push(L(STR.aiRevEarly));
      } else {
        var rev = p.review || {};
        var missing = [];
        if (!rev.cases) missing.push(zh ? '案例条目' : 'case');
        if (!rev.template) missing.push(zh ? '模板更新' : 'template');
        if (!rev.risks) missing.push(zh ? '风险库补充' : 'risk library');
        revBlock.push(missing.length ? L(STR.aiRevNo).replace('{m}', missing.join('、')) : L(STR.aiRevOk));
      }

      /* 5. 结论 */
      var done = stepsDone(p), total = stepsTotal(p);
      var verdict = [L(STR.aiT5)];
      verdict.push(L(STR.aiStageMap).replace('{st}', stageLabel(p.stage)).replace('{d}', done).replace('{t}', total));
      if (critMissing.length) verdict.push(L(STR.aiFixCrit));
      else if (pending && gates.length && gates.filter(function (g) { return g.status === '待审'; }).length) verdict.push(L(STR.aiFixGate));
      else if (!files.length) verdict.push(L(STR.aiFixFile));
      else verdict.push(L(STR.aiGoOn));

      var text = [critBlock, gateBlock, fileBlock, revBlock, verdict]
        .map(function (b) { return b.join('\n'); }).join('\n\n');

      var store = lsGet(LS_AI, {});
      if (!store[pid]) store[pid] = [];
      store[pid].unshift({ at: nowStr(), text: text });
      store[pid] = store[pid].slice(0, 20);
      lsSet(LS_AI, store);
      refreshDetail(pid);
    }

        (local
          ? '<div class="rv-input" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
            '<label class="btn upload-label">' + esc(L(STR.uploadBtn)) +
            '<input type="file" id="fileInput" multiple style="display:none"></label>' +
            '<label class="btn upload-label">' + esc(L(STR.projImport)) +
            '<input type="file" id="projFileInput" accept=".json,application/json" style="display:none"></label>' +
            '<button type="button" class="btn" onclick="exportOneProject(\'' + esc(p.id) + '\')">' + esc(L(STR.projExport)) + '</button>' +
            '</div>' +
            '<p class="files-hint">' + esc(L(STR.projImportHint)) + '</p>'
          : '<p class="files-hint">' + esc(L(STR.archExample)) + '</p>') +
        '</div>';

      /* AI 分析区 */
      var aiHtml =
        '<div class="m-ai"><div class="s-label">' + esc(L(STR.aiTitle)) + '</div>' +
        (analyses.length
          ? '<div class="ai-list">' + analyses.map(function (a) {
              return '<div class="ai-item"><div class="ai-time">' + esc(L(STR.aiAt)) + esc(a.at) + '</div>' +
                '<pre class="ai-text">' + esc(a.text) + '</pre></div>';
            }).join('') + '</div>'
          : '<p class="files-empty">' + esc(L(STR.aiEmpty)) + '</p>') +
        (local
          ? '<div class="form-actions" style="margin-top:10px"><button type="button" class="btn btn-primary" onclick="runAnalysis(\'' + esc(p.id) + '\')">' + esc(L(STR.aiRun)) + '</button></div>'
          : '') +
        '</div>';

      /* 三资产编辑 + 归档区（仅本地项目、复盘阶段） */
      var archiveHtml = '';
      if (local) {
        var canArchive = p.stage === '复盘';
        archiveHtml =
          '<div class="m-archive"><div class="s-label">' + esc(L(STR.reviewAssets)) + '</div>' +
          '<div class="wz-field"><label>' + esc(L(STR.reviewCases)) + '</label><textarea id="rvCases">' + esc(rev.cases || '') + '</textarea></div>' +
          '<div class="wz-field"><label>' + esc(L(STR.reviewTpl)) + '</label><textarea id="rvTpl">' + esc(rev.template || '') + '</textarea></div>' +
          '<div class="wz-field"><label>' + esc(L(STR.reviewRisk)) + '</label><textarea id="rvRisk">' + esc(rev.risks || '') + '</textarea></div>' +
          '<div class="form-actions">' +
            '<button type="button" class="btn" id="saveRevBtn">' + esc(L(STR.reviewAssets)) + '</button>' +
            (p.archived
              ? '<button type="button" class="btn" id="exportBtn">' + esc(L(STR.archExport)) + '</button>'
              : '<button type="button" class="btn btn-primary" id="archiveBtn"' + (canArchive ? '' : ' disabled title="' + esc(L(STR.archNeedReview)) + '"') + '>' + esc(L(STR.archBtn)) + '</button>') +
          '</div>' +
          (p.archived ? '' : '<p class="files-hint">' + esc(canArchive ? L(STR.archConfirm) : L(STR.archNeedReview)) + '</p>') +
          '</div>';
      } else if (p.archived) {
        archiveHtml = '';
      }

      /* 产出物：本地项目可编辑（名称 / 进度 / 时间节点），示例项目只读 */
      var deliverHtml = '';
      if (local || deliverables.length) {
        deliverHtml = '<div class="m-deliver"><div class="s-label">' + esc(L(STR.deliver)) + '</div>';
        if (local) {
          deliverHtml += '<div id="dvlRows">' + deliverables.map(function (d) { return dvlRowHtml(d); }).join('') + '</div>' +
            '<div class="form-actions dvl-actions">' +
              '<button type="button" class="btn" id="dvlAddBtn">' + esc(L(STR.dvlAdd)) + '</button>' +
              '<button type="button" class="btn btn-primary" id="dvlSaveBtn">' + esc(L(STR.dvlSave)) + '</button>' +
            '</div>';
        } else {
          deliverHtml += '<ul>' + deliverables.map(function (d) {
            return '<li>' + esc(d.name || '') +
              (d.due ? ' <span class="dvl-due-show">· ' + esc(L(STR.dvlDue)) + ' ' + esc(d.due) + '</span>' : '') +
              '<div class="p-progress"><i style="width:' + (d.progress || 0) + '%"></i></div></li>';
          }).join('') + '</ul>';
        }
        deliverHtml += '</div>';
      }

      document.getElementById('modalBody').innerHTML =
        '<button class="m-close" onclick="closeDetail()">×</button>' +
        '<h3>' + esc(p.name) + '</h3>' +
        '<div class="m-sub">' + esc(p.goal || '') + '</div>' +
        (p.link
          ? '<div class="p-link-box">' +
            '<a href="' + esc(fileHref(p.link)) + '" target="_blank" rel="noopener">▤ ' + esc(L(STR.linkOpen)) + '</a>' +
            '<button type="button" class="btn btn-mini" onclick="copyProjLink(this)">' + esc(L(STR.linkCopy)) + '</button>' +
            '<code class="link-path">' + esc(p.link) + '</code>' +
            '<span class="link-hint">' + esc(L(STR.linkHint)) + '</span>' +
          '</div>'
          : '') +
        '<div class="p-tags m-meta">' + metaChips + '</div>' +
        rec + criteria + wfHtml + gatesHtml +
        deliverHtml +
        filesHtml + aiHtml + archiveHtml;

      /* 绑定本弹窗内的交互 */
      var fi = document.getElementById('fileInput');
      if (fi) fi.addEventListener('change', function () {
        if (this.files.length) registerFiles(p.id, this.files);
      });
      var pfi = document.getElementById('projFileInput');
      if (pfi) pfi.addEventListener('change', function () {
        if (this.files.length) importProjectFileInto(p.id, this.files[0]);
        this.value = '';
      });
      var dvlAdd = document.getElementById('dvlAddBtn');
      if (dvlAdd) dvlAdd.addEventListener('click', function () { addDvlRow(); });
      var dvlSave = document.getElementById('dvlSaveBtn');
      if (dvlSave) dvlSave.addEventListener('click', function () { saveDeliverables(p.id); });
      document.querySelectorAll('#dvlRows .dvl-prog').forEach(function (r) {
        r.addEventListener('input', function () {
          var num = this.parentNode.querySelector('.dvl-prog-num');
          if (num) num.textContent = this.value + '%';
        });
      });
      var saveRev = document.getElementById('saveRevBtn');
      if (saveRev) saveRev.addEventListener('click', function () { saveReviewAssets(p.id); });
      var archBtn = document.getElementById('archiveBtn');
      if (archBtn && !archBtn.disabled) archBtn.addEventListener('click', function () { archiveProject(p.id); });
      var expBtn = document.getElementById('exportBtn');
      if (expBtn) expBtn.addEventListener('click', function () { exportArchive(p.id); });
    }

    function saveReviewAssets(pid) {
      var locals = loadLocal();
      var p = locals.filter(function (x) { return x.id === pid; })[0];
      if (!p) return;
      p.review = {
        cases: document.getElementById('rvCases').value.trim(),
        template: document.getElementById('rvTpl').value.trim(),
        risks: document.getElementById('rvRisk').value.trim()
      };
      p.updatedAt = today();
      saveLocal(locals);
      toast(L(STR.reviewAssets) + ' ✓');
      renderBoard();
    }

    /* =========================================================
     * 阶段 / 门径 / 产出物交互（本地项目）
     * ========================================================= */
    function setProjectStage(pid, stage) {
      if (STAGES.indexOf(stage) < 0) return;
      var locals = loadLocal();
      var p = locals.filter(function (x) { return x.id === pid; })[0];
      if (!p || p.stage === stage) return;
      p.stage = stage;
      p.updatedAt = today();
      saveLocal(locals);
      renderBoard();
      refreshDetail(pid);
      toast(L(STR.stageMoved).replace('{s}', stageLabel(stage)));
    }

    var GATE_CYCLE = { '通过': '待审', '待审': '未到', '未到': '通过' };
    function cycleGateStatus(pid, idx) {
      var locals = loadLocal();
      var p = locals.filter(function (x) { return x.id === pid; })[0];
      if (!p || !Array.isArray(p.gates) || !p.gates[idx]) return;
      p.gates[idx].status = GATE_CYCLE[p.gates[idx].status] || '未到';
      p.updatedAt = today();
      saveLocal(locals);
      renderBoard();
      renderDetail();
      toast(L(STR.gateMoved));
    }

    var STEP_CYCLE = { '待开始': '进行中', '进行中': '完成', '完成': '待开始' };
    function cycleStepStatus(pid, idx) {
      var locals = loadLocal();
      var p = locals.filter(function (x) { return x.id === pid; })[0];
      if (!p || !Array.isArray(p.workflow) || !p.workflow[idx]) return;
      p.workflow[idx].status = STEP_CYCLE[p.workflow[idx].status] || '待开始';
      p.updatedAt = today();
      saveLocal(locals);
      renderBoard();
      renderDetail();
      toast(L(STR.stepMoved));
    }

    function pCardKey(e, pid) {
      if (e.target !== e.currentTarget) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(pid); }
    }
    function stepKey(e, pid, idx) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycleStepStatus(pid, idx); }
    }
    function gateKey(e, pid, idx) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycleGateStatus(pid, idx); }
    }

    function copyProjLink(btn) {
      var code = btn.parentNode.querySelector('.link-path');
      if (!code) return;
      var txt = code.textContent;
      function done() { toast(L(STR.linkCopied)); }
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = txt;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
    }

    function dvlRowHtml(d) {
      if (typeof d === 'string') d = { name: d };
      d = d || {};
      var prog = (typeof d.progress === 'number' && d.progress >= 0) ? Math.min(100, Math.round(d.progress)) : 0;
      return '<div class="dvl-row">' +
        '<input type="text" class="dvl-name" value="' + esc(d.name || '') + '" placeholder="' + esc(L(STR.dvlName)) + '">' +
        '<input type="range" class="dvl-prog" min="0" max="100" step="5" value="' + prog + '">' +
        '<span class="dvl-prog-num">' + prog + '%</span>' +
        '<input type="date" class="dvl-due" value="' + esc(d.due || '') + '">' +
        '<button type="button" class="btn btn-mini btn-danger-ghost" onclick="removeDvlRow(this)">×</button>' +
      '</div>';
    }

    function addDvlRow() {
      var box = document.getElementById('dvlRows');
      if (!box) return;
      box.insertAdjacentHTML('beforeend', dvlRowHtml({}));
      var row = box.lastElementChild;
      row.querySelector('.dvl-name').focus();
      row.querySelector('.dvl-prog').addEventListener('input', function () {
        var num = this.parentNode.querySelector('.dvl-prog-num');
        if (num) num.textContent = this.value + '%';
      });
    }

    function removeDvlRow(btn) {
      var row = btn.parentNode;
      if (row && row.parentNode) row.parentNode.removeChild(row);
    }

    function saveDeliverables(pid) {
      var locals = loadLocal();
      var p = locals.filter(function (x) { return x.id === pid; })[0];
      if (!p) return;
      var list = [];
      document.querySelectorAll('#dvlRows .dvl-row').forEach(function (r) {
        var name = r.querySelector('.dvl-name').value.trim();
        if (!name) return;
        list.push({
          name: name,
          progress: Math.max(0, Math.min(100, parseInt(r.querySelector('.dvl-prog').value, 10) || 0)),
          due: r.querySelector('.dvl-due').value || ''
        });
      });
      p.deliverables = list;
      p.updatedAt = today();
      saveLocal(locals);
      renderBoard();
      renderDetail();
      toast(L(STR.dvlSaved));
    }

    /* =========================================================
     * 归档与导出
     * ========================================================= */
    function archiveProject(pid) {
      var locals = loadLocal();
      var p = locals.filter(function (x) { return x.id === pid; })[0];
      if (!p) return;
      var rev = p.review || {};
      if (!rev.cases || !rev.template || !rev.risks) {
        toast(L(STR.archNeedAssets));
        return;
      }
      if (!confirm(L(STR.archConfirm))) return;
      p.archived = true;
      p.updatedAt = today();
      saveLocal(locals);
      renderBoard();
      renderDetail();
      toast(L(STR.archDone));
    }

    function exportArchive(pid) {
      var p = findProject(pid);
      if (!p) return;
      var files = filesOf(pid);
      var analyses = analysisOf(pid);
      var rev = p.review || {};
      var zh = getLang() !== 'en';
      var lines = [];
      lines.push('# ' + p.name);
      lines.push('');
      lines.push('- ' + (zh ? '类型 / 等级 / 规模' : 'Type / Level / Scale') + ': ' +
        L(TYPES[p.type] ? TYPES[p.type].name : { zh: '-', en: '-' }) + ' / ' +
        L((LEVELS[p.level] || LEVELS.M).name) + ' / ' + (SCALES[p.scale] ? L(SCALES[p.scale]) : '-'));
      lines.push('- ' + (zh ? '阶段' : 'Stage') + ': ' + p.stage + ' · ' + (zh ? '更新' : 'Updated') + ': ' + p.updatedAt);
      lines.push('- ' + (zh ? '目标' : 'Goal') + ': ' + (p.goal || '-'));
      lines.push('- ' + (zh ? '验收标准' : 'Acceptance') + ': ' + (p.accept || '-'));
      lines.push('- ' + (zh ? '放弃条件' : 'Kill criteria') + ': ' + (p.kill || '-'));
      lines.push('');
      lines.push('## ' + (zh ? '工作流' : 'Workflow'));
      (p.workflow || []).forEach(function (s) {
        lines.push('- [' + s.status + '] ' + s.step + ' · ' + (s.agent || '') + (s.output ? ' → ' + s.output : ''));
      });
      lines.push('');
      lines.push('## ' + (zh ? '门径' : 'Gates'));
      (p.gates || []).forEach(function (g) {
        lines.push('- [' + g.status + '] ' + g.name + (g.note ? ' · ' + g.note : ''));
      });
      lines.push('');
      lines.push('## ' + (zh ? '产出物清单' : 'Deliverables'));
      (p.deliverables || []).forEach(function (d) {
        if (typeof d === 'string') { lines.push('- ' + d); return; }
        lines.push('- ' + (d.name || '-') + ' · ' + (d.progress || 0) + '%' + (d.due ? ' · ' + d.due : ''));
      });
      lines.push('');
      lines.push('## ' + (zh ? '资料清单' : 'Files'));
      if (files.length) files.forEach(function (f) {
        lines.push('- ' + f.name + ' · ' + (f.metaOnly ? 'meta' : 'text') + ' · ' + Math.round(f.size / 1024) + 'KB · ' + f.addedAt);
      }); else lines.push('- ' + (zh ? '（无）' : '(none)'));
      lines.push('');
      lines.push('## ' + (zh ? 'AI 分析记录' : 'AI analysis'));
      if (analyses.length) analyses.forEach(function (a) {
        lines.push('### ' + a.at);
        lines.push(a.text);
        lines.push('');
      }); else lines.push('- ' + (zh ? '（无）' : '(none)'));
      lines.push('## ' + (zh ? '复盘三资产' : 'Review assets'));
      lines.push('- ' + (zh ? '案例条目' : 'Case') + ': ' + (rev.cases || '-'));
      lines.push('- ' + (zh ? '模板更新' : 'Template') + ': ' + (rev.template || '-'));
      lines.push('- ' + (zh ? '风险库补充' : 'Risk') + ': ' + (rev.risks || '-'));
      lines.push('');
      lines.push('---');
      lines.push((zh ? '归档时间' : 'Archived at') + ': ' + nowStr() + ' · raphaelliu.cn ' + (zh ? '项目库' : 'Projects'));

      downloadText(p.name + '-归档报告.md', lines.join('\n'));
    }

    /* =========================================================
     * 本地数据导出 / 导入（项目 + 资料 + 分析记录）
     * ========================================================= */
    function exportLocalData() {
      var locals = loadLocal();
      if (!locals.length) { toast(L(STR.expLocalEmpty)); return; }
      var payload = {
        app: 'raphaelliu-projects',
        version: 1,
        exportedAt: nowStr(),
        projects: lsGet(LS_PROJ, []),
        files: lsGet(LS_FILES, {}),
        analysis: lsGet(LS_AI, {})
      };
      downloadText('项目库本地数据-' + today() + '.json', JSON.stringify(payload, null, 2));
      toast(L(STR.expLocalOk).replace('{n}', locals.length));
    }

    /* 统一导入：支持整库备份（projects 数组）、项目数组、单个项目文件三种格式 */
    function normalizeImported(data) {
      var list = [];
      if (Array.isArray(data)) list = data;
      else if (data && Array.isArray(data.projects)) list = data.projects;
      else if (data && (data.id || data.name)) list = [data];
      var stamp = Date.now().toString(36);
      var out = [];
      list.forEach(function (p, i) {
        if (!p || typeof p !== 'object' || !(p.name || p.id)) return;
        var q = JSON.parse(JSON.stringify(p));
        /* 数据文件里的示例项目 ID 不带 local-，导入后必须换成本地 ID，否则会被当作只读示例 */
        if (!/^local-/.test(String(q.id || ''))) q.id = 'local-imp-' + stamp + '-' + i;
        q.name = String(q.name || q.id).slice(0, 80);
        if (STAGES.indexOf(q.stage) < 0) q.stage = '构想';
        q.archived = !!q.archived;
        q.updatedAt = q.updatedAt || today();
        out.push(q);
      });
      return out;
    }

    function mergeImported(incoming, extraFiles, extraAi) {
      var current = lsGet(LS_PROJ, []);
      var dup = incoming.filter(function (q) {
        return current.some(function (p) { return p.id === q.id; });
      }).length;
      if (dup && !window.confirm(L(STR.impConfirm).replace('{n}', dup))) return 0;
      var merged = current.filter(function (p) {
        return !incoming.some(function (q) { return q.id === p.id; });
      });
      lsSet(LS_PROJ, incoming.concat(merged));
      if (extraFiles && typeof extraFiles === 'object') {
        var fs2 = lsGet(LS_FILES, {});
        Object.keys(extraFiles).forEach(function (k) { fs2[k] = extraFiles[k]; });
        lsSet(LS_FILES, fs2);
      }
      if (extraAi && typeof extraAi === 'object') {
        var ai = lsGet(LS_AI, {});
        Object.keys(extraAi).forEach(function (k) { ai[k] = extraAi[k]; });
        lsSet(LS_AI, ai);
      }
      renderBoard();
      return incoming.length;
    }

    function importLocalData(file) {
      var reader = new FileReader();
      reader.onload = function () {
        var data = null;
        try { data = JSON.parse(String(reader.result || '')); } catch (e) {}
        var incoming = data ? normalizeImported(data) : [];
        if (!incoming.length) { toast(L(STR.impLocalBad)); return; }
        var n = mergeImported(incoming, data.files, data.analysis);
        if (n) toast(L(STR.impLocalOk).replace('{n}', n));
      };
      reader.readAsText(file);
    }

    /* 单个项目：导出为独立项目文件（含资料与分析记录） */
    function exportOneProject(id) {
      var p = findProject(id);
      if (!p) return;
      var files = {}, analysis = {};
      var f = filesOf(id);
      var a = analysisOf(id);
      if (f.length) files[id] = f;
      if (a.length) analysis[id] = a;
      downloadText(String(p.name || 'project') + '-项目文件-' + today() + '.json', JSON.stringify({
        app: 'raphaelliu-projects', version: 1, exportedAt: nowStr(),
        projects: [p], files: files, analysis: analysis
      }, null, 2));
      toast(L(STR.projExportOk));
    }

    /* 在项目详情里导入项目文件：是项目 JSON 就入库，其他文件当作资料附加 */
    function importProjectFileInto(pid, file) {
      var reader = new FileReader();
      reader.onload = function () {
        var data = null;
        try { data = JSON.parse(String(reader.result || '')); } catch (e) {}
        var incoming = data ? normalizeImported(data) : [];
        if (!incoming.length) {
          registerFiles(pid, [file]);
          return;
        }
        var n = mergeImported(
          incoming,
          (data.files && typeof data.files === 'object') ? data.files : null,
          (data.analysis && typeof data.analysis === 'object') ? data.analysis : null
        );
        if (!n) return;
        refreshDetail(pid);
        toast(L(STR.projImportOk).replace('{n}', n));
      };
      reader.readAsText(file);
    }

    function downloadText(filename, text) {
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    /* =========================================================
     * 事件绑定与启动
     * ========================================================= */
    ['filterStage', 'filterType', 'filterLevel'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', renderBoard);
    });
    document.getElementById('searchKw').addEventListener('input', renderBoard);
    document.getElementById('newProjectBtn').addEventListener('click', openWizard);
    document.getElementById('exportLocalBtn').addEventListener('click', exportLocalData);
    document.getElementById('importLocalBtn').addEventListener('click', function () {
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', function () {
      if (this.files.length) importLocalData(this.files[0]);
      this.value = '';
    });
    document.getElementById('selectModeBtn').addEventListener('click', toggleSelectMode);
    document.getElementById('selAllBtn').addEventListener('click', selectAllVisible);
    document.getElementById('selDeleteBtn').addEventListener('click', deleteSelected);
    document.getElementById('selExportBtn').addEventListener('click', exportSelected);
    document.getElementById('selImportBtn').addEventListener('click', function () {
      document.getElementById('importFile').click();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeDetail(); closeWizard(); }
    });

    /* 暴露给内联 onclick 使用 */
    window.openDetail = openDetail;
    window.closeDetail = closeDetail;
    window.closeWizard = closeWizard;
    window.deleteFile = deleteFile;
    window.runAnalysis = runAnalysis;
    window.setProjectStage = setProjectStage;
    window.cycleGateStatus = cycleGateStatus;
    window.removeDvlRow = removeDvlRow;
    window.pCardKey = pCardKey;
    window.stepKey = stepKey;
    window.gateKey = gateKey;
    window.cycleStepStatus = cycleStepStatus;
    window.copyProjLink = copyProjLink;
    window.pCardClick = pCardClick;
    window.toggleSelect = toggleSelect;
    window.exportOneProject = exportOneProject;

    buildFilters();
    renderBoard();

    /* 切语言后无刷新重渲染看板与筛选；已打开的弹窗保持现状（重开即新语言） */
    document.addEventListener('langchange', function () {
      buildFilters();
      renderBoard();
    });
  </script>
</body>
</html>
