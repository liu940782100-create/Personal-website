<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="汇集科技 / 财经 / 政治 / 军事 / 储能五赛道热点，拆解叙事手法，沉淀可迁移的创作技巧。">
  <meta name="theme-color" content="#f9f7f1">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="灵感库 · Raphael Liu">
  <meta property="og:description" content="汇集科技 / 财经 / 政治 / 军事 / 储能五赛道热点，拆解叙事手法，沉淀可迁移的创作技巧。">
  <title>灵感库 · Raphael Liu</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
  <script src="data/inspiration.js"></script>
  <script src="assets/app.js"></script>
</head>
<body data-page="inspiration">
  <div id="nav"></div>

  <main class="container">
    <section class="page-head">
      <h1 data-i18n="insp.head">灵感库</h1>
      <p data-i18n="insp.sub">汇集财经 / 科技 / 政治 / 军事 / 储能五赛道热点，拆解叙事手法，沉淀可迁移创作技巧</p>
      <p class="insp-meta" id="inspMeta" hidden></p>
    </section>

    <nav class="track-row" id="trackRow" aria-label="赛道分类"></nav>

    <div class="toolbar">
      <select id="sortBy">
        <option value="published-desc" selected data-i18n="insp.sort.latest">最新发布优先</option>
        <option value="likes-desc" data-i18n="insp.sort.likes">高互动优先（点赞↓）</option>
      </select>
      <input type="text" id="searchKw" class="grow" placeholder="搜索：标题 / 博主 / 内容总结 / 叙事技巧…" data-i18n-ph="insp.search.ph">
      <span class="count" id="countInfo"></span>
      <button type="button" class="btn" id="inspToggleBtn" data-i18n="insp.form.show">＋ 记一条灵感</button>
      <button type="button" class="btn" id="inspExportBtn" data-i18n="insp.export">导出本地灵感</button>
      <button type="button" class="btn btn-primary" id="inspRefreshBtn" data-i18n="insp.refresh" title="页内直接触发云端采集更新">更新</button>
    </div>

    <section class="quick-form" id="inspFormPanel" hidden>
      <h3 data-i18n="insp.form.title">手动记一条灵感</h3>
      <p class="qf-hint" data-i18n="insp.form.hint"></p>
      <div class="qf-grid">
        <label><span data-i18n="insp.label.title">标题 *</span><input id="i-title" type="text"></label>
        <label><span data-i18n="insp.label.author">博主（可空）</span><input id="i-author" type="text"></label>
        <label><span data-i18n="insp.label.platform">平台</span>
          <select id="i-platform">
            <option value="微信公众号">微信公众号</option>
            <option value="抖音">抖音</option>
            <option value="推特">推特</option>
            <option value="油管">油管</option>
            <option value="国家媒体">国家媒体</option>
            <option value="">其他平台</option>
          </select>
        </label>
        <label><span data-i18n="insp.label.domain">赛道（可空）</span><input id="i-domain" type="text"></label>
        <label><span data-i18n="insp.label.link">原文链接（可空）</span><input id="i-link" type="url" placeholder="https://v.douyin.com/…"></label>
      </div>
      <label><span data-i18n="insp.label.summary">内容总结 *</span><textarea id="i-summary" rows="3"></textarea></label>
      <label><span data-i18n="insp.label.transfer">可迁移技巧（每行一条，可空）</span><textarea id="i-transfer" rows="2"></textarea></label>
      <div class="qf-actions">
        <button type="button" class="btn btn-primary" id="inspSaveBtn" data-i18n="insp.save">保存灵感</button>
      </div>
    </section>

    <section class="quick-form" id="inspTokenPanel" hidden>
      <h3 data-i18n="insp.token.title">设置 GitHub 令牌</h3>
      <p class="qf-hint" data-i18n="insp.token.hint"></p>
      <div class="qf-grid">
        <label><span data-i18n="insp.token.label">令牌</span><input id="gh-token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
      </div>
      <div class="qf-actions">
        <button type="button" class="btn btn-primary" id="ghTokenSave" data-i18n="insp.token.save">保存令牌</button>
        <button type="button" class="btn" id="ghTokenClear" data-i18n="insp.token.clear">清除令牌</button>
      </div>
    </section>

    <section class="insp-grid" id="inspGrid"></section>
  </main>

  <div id="footer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    document.getElementById('nav').innerHTML = renderNav('inspiration.html');
    document.getElementById('footer').innerHTML = renderFooter();

    /* ---------- 本地新增与导出（与知识库同模式） ---------- */
    var LS_INSP = 'rl_insp_local_v1';
    function today() { return new Date().toISOString().slice(0, 10); }
    function downloadText(filename, text) {
      var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._timer);
      el._timer = setTimeout(function () { el.classList.remove('show'); }, 2600);
    }
    /* 点赞备档：快照存本浏览器，同步在项目库生成本地「灵感备档」项目 */
    var LS_LIKED = 'rl_insp_liked_v1';
    var LS_PROJ_LOCAL = 'rl_projects_local_v1';
    function loadLiked() {
      try { return JSON.parse(localStorage.getItem(LS_LIKED) || '[]'); } catch (e) { return []; }
    }
    function isLiked(id) { return loadLiked().some(function (x) { return x.id === id; }); }
    function toggleLike(id) {
      var liked = loadLiked();
      var idx = -1;
      for (var i = 0; i < liked.length; i++) if (liked[i].id === id) { idx = i; break; }
      var locals;
      try { locals = JSON.parse(localStorage.getItem(LS_PROJ_LOCAL) || '[]'); } catch (e) { locals = []; }
      if (!Array.isArray(locals)) locals = [];
      var projId = 'local-insp-' + id;
      var pi = -1;
      for (var j = 0; j < locals.length; j++) if (locals[j].id === projId) { pi = j; break; }
      if (idx >= 0) { /* 取消备档：灵感快照与项目库条目一并移除 */
        liked.splice(idx, 1);
        if (pi >= 0) locals.splice(pi, 1);
        toast(t('insp.toast.unliked'));
      } else {
        var it = null;
        var items = allItems();
        for (var k = 0; k < items.length; k++) if (items[k].id === id) { it = items[k]; break; }
        if (!it) return;
        liked.push(JSON.parse(JSON.stringify(it)));
        var tr = (it.narrativeAnalysis && it.narrativeAnalysis.transferable) || [];
        var steps = tr.length ? tr.map(function (tt, i) {
          return { step: '创作应用 ' + (i + 1) + '：' + tt, agent: '个人创作', output: '', status: '待开始' };
        }) : [{ step: '选题构思', agent: '个人创作', output: '', status: '待开始' }];
        locals.unshift({
          id: projId,
          name: ('灵感备档 · ' + (it.title || '')).slice(0, 42),
          stage: '构想', type: 'mkt', level: 'S', scale: 'micro',
          goal: it.contentSummary || it.title || '',
          accept: '将该灵感的可迁移技巧用进个人创作',
          kill: '', gates: [],
          workflow: steps,
          deliverables: it.link ? [it.link] : [],
          inspSource: { platform: it.platform || '', author: it.author || '', link: it.link || '', title: it.title || '', track: it.domain || it.track || '' },
          updatedAt: new Date().toISOString().slice(0, 10)
        });
        toast(t('insp.toast.liked'));
      }
      localStorage.setItem(LS_LIKED, JSON.stringify(liked));
      localStorage.setItem(LS_PROJ_LOCAL, JSON.stringify(locals));
      renderGrid();
    }

    function loadLocalInsp() {
      try { return JSON.parse(localStorage.getItem(LS_INSP) || '[]'); } catch (e) { return []; }
    }
    function saveLocalInsp(arr) { localStorage.setItem(LS_INSP, JSON.stringify(arr)); }
    function allItems() { return getData('inspiration').concat(loadLocalInsp()); }

    /* 平台徽章配色：官方媒体 / 科技 / 储能 / 军事 / 社交平台 各成一色；未列出的媒体用中性色 */
    var PLATFORM_CLASS = {
      '国家媒体': 'p-official', '官方媒体': 'p-official',
      '人民网': 'p-official', '新华网': 'p-official', '新华社': 'p-official',
      '央视新闻': 'p-official', '中新网': 'p-official', '中国政府网': 'p-official',
      'IT之家': 'p-tech', '量子位': 'p-tech', '雷锋网': 'p-tech',
      '北极星储能网': 'p-energy',
      '央视军事': 'p-mil', '中国军网': 'p-mil', '凤凰军事': 'p-mil',
      'B站': 'p-bilibili',
      '媒体报道': 'p-media',
      '抖音': 'p-douyin', '微信公众号': 'p-weixin', '知乎': 'p-zhihu',
      '油管': 'p-youtube', '推特': 'p-twitter'
    };
    var SEARCH_FIELDS = ['title', 'author', 'contentSummary', 'domain',
      'narrativeAnalysis.hook', 'narrativeAnalysis.structure',
      'narrativeAnalysis.emotionCurve', 'narrativeAnalysis.transferable'];

    function likesOf(item) { return (item.metrics && item.metrics.likes) || 0; }
    function commentsOf(item) { return (item.metrics && item.metrics.comments) || 0; }

    function renderCard(item) {
      var a = item.narrativeAnalysis || {};
      var transferable = Array.isArray(a.transferable) ? a.transferable : [];
      return '<article class="i-card" data-id="' + esc(item.id) + '">' +
        '<div class="i-top">' +
          (item.id && String(item.id).indexOf('local-') === 0 ? '<span class="local-badge">' + t('insp.localBadge') + '</span>' : '') +
          '<span class="platform-badge ' + (PLATFORM_CLASS[item.platform] || '') + '">' + esc(item.platform || t('insp.otherPlatform')) + '</span>' +
          '<span class="i-domain">' + esc(item.domain || t('insp.noDomain')) + '</span>' +
        '</div>' +
        '<h4>' + (item.link
          ? '<a href="' + esc(item.link) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>'
          : esc(item.title)) + '</h4>' +
        (item.link
          ? '<div class="i-linkrow"><a class="i-link-chip" href="' + esc(item.link) + '" target="_blank" rel="noopener">' + t('insp.viewOriginal') + '</a></div>'
          : '') +
        '<div class="i-author">' + t('insp.author') + esc(item.author || t('insp.unknown')) + '</div>' +
        '<div class="i-metrics">' +
          '<span>' + t('insp.likes') + ' ' + fmtNum(likesOf(item)) + '</span>' +
          '<span>' + t('insp.comments') + ' ' + fmtNum(commentsOf(item)) + '</span>' +
          (item.published || (item.metrics && item.metrics.collected) ? '<span>' + t('insp.published') + esc(pubOf(item)) + '</span>' : '') +
          '<button type="button" class="like-btn' + (isLiked(item.id) ? ' on' : '') + '" onclick="toggleLike(\'' + esc(item.id) + '\')">' +
            (isLiked(item.id) ? '♥ ' + t('insp.liked') : '♡ ' + t('insp.like')) + '</button>' +
        '</div>' +
        '<div class="i-summary">' + esc(item.contentSummary || t('insp.noSummary')) + '</div>' +
        '<button class="i-toggle" onclick="toggleCard(this)">' + t('insp.expand') + '</button>' +
        '<div class="i-analysis">' +
          '<div class="k-item"><div class="k-label">' + t('insp.label.hook') + '</div><div class="k-text">' + esc(a.hook || t('insp.pending')) + '</div></div>' +
          '<div class="k-item"><div class="k-label">' + t('insp.label.structure') + '</div><div class="k-text">' + esc(a.structure || t('insp.pending')) + '</div></div>' +
          '<div class="k-item"><div class="k-label">' + t('insp.label.emotion') + '</div><div class="k-text">' + esc(a.emotionCurve || t('insp.pending')) + '</div></div>' +
          '<div class="k-item"><div class="k-label">' + t('insp.label.transfer') + '</div><div class="k-text">' +
            (transferable.length ? transferable.map(function (tt) { return '· ' + esc(tt); }).join('<br>') : t('insp.pending')) +
          '</div></div>' +
        '</div>' +
      '</article>';
    }

    function toggleCard(btn) {
      var card = btn.closest('.i-card');
      card.classList.toggle('open');
      btn.textContent = card.classList.contains('open')
        ? t('insp.collapse') : t('insp.expand');
    }

    /* 赛道分类抬头：独立一行 tab，动态生成自数据，点击即过滤 */
    var currentTrack = '';
    function trackOf(it) { return (it.track || it.domain || '').trim(); }
    function renderTrackTabs() {
      var tracks = [];
      allItems().forEach(function (it) {
        var d = trackOf(it);
        if (d && tracks.indexOf(d) < 0) tracks.push(d);
      });
      document.getElementById('trackRow').innerHTML =
        '<button type="button" class="track-tab' + (currentTrack ? '' : ' on') + '" data-t="">' + t('insp.allDomain') + '</button>' +
        tracks.map(function (d) {
          return '<button type="button" class="track-tab' + (currentTrack === d ? ' on' : '') + '" data-t="' + esc(d) + '">' + esc(d) + '</button>';
        }).join('');
    }

    function pubOf(it) { return String(it.published || (it.metrics && it.metrics.collected) || ''); }

    function renderGrid() {
      var sortBy = document.getElementById('sortBy').value;
      var kw = document.getElementById('searchKw').value.trim();

      var list = allItems().filter(function (it) {
        if (currentTrack && trackOf(it) !== currentTrack) return false;
        return matchKeyword(it, kw, SEARCH_FIELDS);
      });

      list.sort(function (a, b) {
        if (sortBy === 'likes-desc') return likesOf(b) - likesOf(a);
        return pubOf(b).localeCompare(pubOf(a)); /* 最新发布优先 */
      });

      document.getElementById('countInfo').textContent =
        list.length + ' / ' + allItems().length + t('insp.count.unit');

      var grid = document.getElementById('inspGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">' + t('common.empty') + '</div>' +
          t('insp.empty') + '</div>';
        return;
      }
      grid.innerHTML = list.map(renderCard).join('');
    }

    document.getElementById('sortBy').addEventListener('change', renderGrid);
    document.getElementById('searchKw').addEventListener('input', renderGrid);
    document.getElementById('trackRow').addEventListener('click', function (e) {
      var btn = e.target.closest('.track-tab');
      if (!btn) return;
      currentTrack = btn.getAttribute('data-t') || '';
      renderTrackTabs();
      renderGrid();
    });

    /* 表单开合 / 保存 / 导出 */
    var formPanel = document.getElementById('inspFormPanel');
    document.getElementById('inspToggleBtn').addEventListener('click', function () {
      var show = formPanel.hidden;
      formPanel.hidden = !show;
      this.textContent = show ? t('insp.form.hide') : t('insp.form.show');
      if (show) document.getElementById('i-title').focus();
    });
    document.getElementById('inspSaveBtn').addEventListener('click', function () {
      var title = document.getElementById('i-title').value.trim();
      var summary = document.getElementById('i-summary').value.trim();
      ['i-title', 'i-summary'].forEach(function (id) {
        document.getElementById(id).classList.remove('f-err');
      });
      var bad = [];
      if (!title) bad.push('i-title');
      if (!summary) bad.push('i-summary');
      if (bad.length) {
        bad.forEach(function (id) { document.getElementById(id).classList.add('f-err'); });
        document.getElementById(bad[0]).scrollIntoView({ behavior: 'smooth', block: 'center' });
        document.getElementById(bad[0]).focus({ preventScroll: true });
        toast(t('insp.err'));
        return;
      }
      var transfer = document.getElementById('i-transfer').value.split('\n')
        .map(function (s) { return s.trim(); }).filter(Boolean);
      var link = document.getElementById('i-link').value.trim();
      if (link) {
        /* 分享口令/整段文字里自动抽出第一个有效链接（抖音口令、公众号消息直接粘贴即可） */
        var mUrl = link.match(/https?:\/\/[^\s'"<>，。；、）】《》]+/i);
        if (mUrl) link = mUrl[0].replace(/[),.;!?'"]+$/, '');
        else if (!/\s/.test(link) && /^[^\s]+\.[^\s]+$/.test(link)) link = 'https://' + link;
        else link = '';
      }
      var item = {
        id: 'local-' + Date.now().toString(36),
        title: title,
        author: document.getElementById('i-author').value.trim(),
        platform: document.getElementById('i-platform').value || t('insp.otherPlatform'),
        domain: document.getElementById('i-domain').value.trim(),
        link: link,
        contentSummary: summary,
        narrativeAnalysis: { transferable: transfer },
        metrics: { likes: 0, comments: 0, collected: today() }
      };
      var locals = loadLocalInsp();
      locals.unshift(item);
      saveLocalInsp(locals);
      ['i-title', 'i-author', 'i-domain', 'i-link', 'i-summary', 'i-transfer'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      renderTrackTabs();
      renderGrid();
      toast(t('insp.toast.saved'));
    });
    /* 出错字段一开始输入就摘掉红圈 */
    document.getElementById('inspFormPanel').addEventListener('input', function (e) {
      if (e.target.classList) e.target.classList.remove('f-err');
    });
    document.getElementById('inspExportBtn').addEventListener('click', function () {
      var locals = loadLocalInsp();
      if (!locals.length) { toast(t('insp.toast.noLocal')); return; }
      downloadText('inspiration-local.json', JSON.stringify(locals, null, 2));
      toast(t('insp.toast.exported'));
    });
    /* ---------- 页内更新：GitHub API 触发云端采集（静态站无后端，采集在 Actions 跑） ----------
     * 令牌只存本机浏览器 localStorage，不写入公开代码库；采集完成后页面自动载入新数据。 */
    var GH = { owner: 'liu940782100-create', repo: 'Personal-website', workflow: 'update-inspiration.yml', ref: 'main', tokenKey: 'rl_gh_token_v1' };
    var updateBtn = document.getElementById('inspRefreshBtn');
    var tokenPanel = document.getElementById('inspTokenPanel');

    function ghToken() { try { return localStorage.getItem(GH.tokenKey) || ''; } catch (e) { return ''; } }
    function ghApi(p, opts) {
      opts = opts || {};
      var h = {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + ghToken(),
        'X-GitHub-Api-Version': '2022-11-28'
      };
      if (opts.headers) { for (var k in opts.headers) h[k] = opts.headers[k]; }
      return fetch('https://api.github.com/repos/' + GH.owner + '/' + GH.repo + p, {
        method: opts.method || 'GET', headers: h, body: opts.body
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
      });
    }
    function setUpdateBtn(text, disabled) { updateBtn.textContent = text; updateBtn.disabled = !!disabled; }
    function loadInspData() {
      return new Promise(function (res) {
        var s = document.createElement('script');
        s.src = 'data/inspiration.js?r=' + Date.now();
        s.onload = function () { res(true); };
        s.onerror = function () { res(false); };
        document.head.appendChild(s);
      });
    }
    function metaUpdatedAt() { return (window.DATA_INSPIRATION_META && window.DATA_INSPIRATION_META.updatedAt) || ''; }

    /* 采集完成 → 等 Pages 重新部署 → 自动载入新数据 */
    function waitForDeploy(prevAt, tries) {
      tries = tries || 0;
      fetch('data/inspiration.js?r=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (txt) {
          var m = txt.match(/DATA_INSPIRATION_META\s*=\s*(\{[\s\S]*?\});/);
          var meta = m ? JSON.parse(m[1]) : null;
          if (meta && meta.updatedAt !== prevAt) {
            loadInspData().then(function () {
              renderTrackTabs(); renderGrid(); renderInspMeta();
              setUpdateBtn(t('insp.refresh'), false);
              toast(t('insp.toast.done').replace('{n}', meta.added != null ? meta.added : 0));
            });
            return;
          }
          if (tries >= 12) { setUpdateBtn(t('insp.refresh'), false); toast(t('insp.toast.noNew')); return; }
          setTimeout(function () { waitForDeploy(prevAt, tries + 1); }, 15000);
        })
        .catch(function () {
          if (tries < 12) setTimeout(function () { waitForDeploy(prevAt, tries + 1); }, 15000);
          else setUpdateBtn(t('insp.refresh'), false);
        });
    }

    function pollRun(startedAt, prevAt, tries) {
      if (tries > 30) { setUpdateBtn(t('insp.refresh'), false); toast(t('insp.toast.noNew')); return; }
      ghApi('/actions/runs?per_page=5').then(function (res) {
        var runs = (res.body && res.body.workflow_runs) || [];
        var mine = null;
        for (var i = 0; i < runs.length; i++) {
          if (runs[i].name === 'Update Inspiration' && new Date(runs[i].created_at).getTime() >= startedAt - 60000) { mine = runs[i]; break; }
        }
        if (!mine) { setTimeout(function () { pollRun(startedAt, prevAt, tries + 1); }, 8000); return; }
        if (mine.status === 'completed') {
          if (mine.conclusion === 'success') { waitForDeploy(prevAt, 0); }
          else { setUpdateBtn(t('insp.refresh'), false); toast(t('insp.toast.runFailed')); }
          return;
        }
        setUpdateBtn(t('insp.updating'), true);
        setTimeout(function () { pollRun(startedAt, prevAt, tries + 1); }, 8000);
      }).catch(function () { setTimeout(function () { pollRun(startedAt, prevAt, tries + 1); }, 8000); });
    }

    function runUpdate() {
      if (!ghToken()) { tokenPanel.hidden = false; toast(t('insp.toast.noToken')); return; }
      setUpdateBtn(t('insp.updating'), true);
      toast(t('insp.toast.updating'));
      var prevAt = metaUpdatedAt();
      var startedAt = Date.now();
      ghApi('/actions/workflows/' + GH.workflow + '/dispatches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ref: GH.ref })
      }).then(function (res) {
        if (!res.ok) {
          throw new Error(res.status === 401 || res.status === 403
            ? t('insp.toast.badToken')
            : ((res.body && res.body.message) || String(res.status)));
        }
        pollRun(startedAt, prevAt, 0);
      }).catch(function (e) {
        setUpdateBtn(t('insp.refresh'), false);
        toast(t('insp.toast.triggerFail').replace('{msg}', String(e.message || e)));
      });
    }
    updateBtn.addEventListener('click', runUpdate);

    /* 令牌面板：保存 / 清除（只存本机浏览器） */
    document.getElementById('ghTokenSave').addEventListener('click', function () {
      var v = document.getElementById('gh-token').value.trim();
      if (!v) { toast(t('insp.toast.noToken')); return; }
      try { localStorage.setItem(GH.tokenKey, v); } catch (e) {}
      document.getElementById('gh-token').value = '';
      tokenPanel.hidden = true;
      toast(t('insp.token.saved'));
    });
    document.getElementById('ghTokenClear').addEventListener('click', function () {
      try { localStorage.removeItem(GH.tokenKey); } catch (e) {}
      tokenPanel.hidden = true;
      toast(t('insp.token.cleared'));
    });
    /* 数据更新时间（由采集管道写入 DATA_INSPIRATION_META） */
    function renderInspMeta() {
      var meta = window.DATA_INSPIRATION_META;
      if (!meta) return;
      var el = document.getElementById('inspMeta');
      el.hidden = false;
      el.textContent = t('insp.meta')
        .replace('{date}', meta.updatedAt || '-')
        .replace('{n}', meta.added != null ? meta.added : '-');
    }
    renderInspMeta();

    renderTrackTabs();
    renderGrid();

    /* 切语言后无刷新重渲染动态内容；表单开合钮文案随面板状态修正 */
    document.addEventListener('langchange', function () {
      renderTrackTabs();
      renderGrid();
      renderInspMeta();
      var btn = document.getElementById('inspToggleBtn');
      btn.textContent = formPanel.hidden ? t('insp.form.show') : t('insp.form.hide');
    });
  </script>
</body>
</html>
